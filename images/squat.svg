<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="800" height="500" fill="#f7f9fc"/>
  <line x1="400" y1="20" x2="400" y2="390" stroke="#d5dbe5" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Titles -->
  <text x="200" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">1. Start: stand tall</text>
  <text x="600" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">2. Bottom: sit back and down</text>

  <!-- Ground -->
  <line x1="40" y1="365" x2="360" y2="365" stroke="#718096" stroke-width="4" stroke-linecap="round"/>
  <line x1="440" y1="365" x2="760" y2="365" stroke="#718096" stroke-width="4" stroke-linecap="round"/>

  <!-- Standing figure (facing right) -->
  <g stroke="#2b6cb0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="235,360 200,360 200,255 200,150 200,85"/>
    <polyline points="200,85 260,95"/>
  </g>
  <circle cx="200" cy="55" r="24" fill="#2b6cb0"/>
  <g fill="#ed8936">
    <circle cx="200" cy="360" r="8"/>
    <circle cx="200" cy="255" r="8"/>
    <circle cx="200" cy="150" r="8"/>
    <circle cx="200" cy="85" r="8"/>
  </g>
  <text x="225" y="262" font-size="16" fill="#c05621" font-weight="bold">knee ~170&#176;+</text>

  <!-- Squatting figure (facing right) -->
  <g stroke="#2b6cb0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="625,360 590,360 640,270 549,209 585,105"/>
    <polyline points="585,105 665,120"/>
  </g>
  <circle cx="598" cy="73" r="24" fill="#2b6cb0"/>
  <g fill="#ed8936">
    <circle cx="590" cy="360" r="8"/>
    <circle cx="640" cy="270" r="8"/>
    <circle cx="549" cy="209" r="8"/>
    <circle cx="585" cy="105" r="8"/>
  </g>
  <!-- Knee angle arc -->
  <path d="M 623 301 A 35 35 0 0 1 611 250" stroke="#c05621" stroke-width="4" fill="none"/>
  <text x="520" y="288" font-size="16" fill="#c05621" font-weight="bold">knee ~95&#176;</text>

  <!-- Tips -->
  <rect x="40" y="405" width="720" height="75" rx="10" fill="#edf2f7"/>
  <text x="60" y="432" font-size="16" fill="#2d3748">&#8226; Feet about shoulder-width apart, chest up, back neutral.</text>
  <text x="60" y="456" font-size="16" fill="#2d3748">&#8226; Push hips back and bend knees; keep knees in line with toes, heels on the floor.</text>
  <text x="60" y="476" font-size="14" fill="#718096">Illustration for educational use. Not a medical or injury assessment.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
