<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" width="800" height="590" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="800" height="590" fill="#f7f9fc"/>
  <line x1="60" y1="250" x2="740" y2="250" stroke="#d5dbe5" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- ===== Row 1: start position ===== -->
  <text x="400" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">1. Start: arms straight, body in one line</text>
  <line x1="100" y1="215" x2="700" y2="215" stroke="#718096" stroke-width="4" stroke-linecap="round"/>

  <!-- Straight-body guide -->
  <line x1="190" y1="177" x2="560" y2="87" stroke="#38a169" stroke-width="3" stroke-dasharray="8 6"/>
  <text transform="rotate(-13.7 200 166)" x="200" y="166" font-size="14" fill="#2f855a" font-weight="bold">straight line</text>

  <g stroke="#2b6cb0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="170,215 190,205 253,190 320,174 560,115"/>
    <polyline points="560,115 560,165 560,215"/>
    <polyline points="560,215 582,215"/>
  </g>
  <line x1="560" y1="115" x2="590" y2="107" stroke="#2b6cb0" stroke-width="12" stroke-linecap="round"/>
  <circle cx="605" cy="104" r="22" fill="#2b6cb0"/>
  <g fill="#ed8936">
    <circle cx="190" cy="205" r="8"/>
    <circle cx="320" cy="174" r="8"/>
    <circle cx="560" cy="115" r="8"/>
    <circle cx="560" cy="165" r="8"/>
    <circle cx="560" cy="215" r="8"/>
  </g>
  <text x="585" y="172" font-size="16" fill="#c05621" font-weight="bold">elbow ~170&#176;+</text>

  <!-- ===== Row 2: bottom position ===== -->
  <text x="400" y="320" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">2. Bottom: elbows bent, body still straight</text>
  <line x1="100" y1="465" x2="700" y2="465" stroke="#718096" stroke-width="4" stroke-linecap="round"/>

  <g stroke="#2b6cb0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="170,465 190,452 253,442 320,432 560,394"/>
    <polyline points="560,394 524,430 560,465"/>
    <polyline points="560,465 582,465"/>
  </g>
  <line x1="560" y1="394" x2="590" y2="389" stroke="#2b6cb0" stroke-width="12" stroke-linecap="round"/>
  <circle cx="605" cy="387" r="22" fill="#2b6cb0"/>
  <g fill="#ed8936">
    <circle cx="190" cy="452" r="8"/>
    <circle cx="320" cy="432" r="8"/>
    <circle cx="560" cy="394" r="8"/>
    <circle cx="524" cy="430" r="8"/>
    <circle cx="560" cy="465" r="8"/>
  </g>
  <!-- Elbow angle arc -->
  <path d="M 544 410 A 28 28 0 0 1 544 450" stroke="#c05621" stroke-width="4" fill="none"/>
  <text x="585" y="440" font-size="16" fill="#c05621" font-weight="bold">elbow ~90&#176;</text>

  <!-- Tips -->
  <rect x="40" y="490" width="720" height="85" rx="10" fill="#edf2f7"/>
  <text x="60" y="515" font-size="16" fill="#2d3748">&#8226; Hands under shoulders, body in one straight line from head to heels.</text>
  <text x="60" y="539" font-size="16" fill="#2d3748">&#8226; Lower until elbows are about 90&#176;, then push back up. Don't let hips sag or rise.</text>
  <text x="60" y="563" font-size="14" fill="#718096">Illustration for educational use. Not a medical or injury assessment.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
